name: Bug report
description: Report a reproducible acquisition, BLE, API, or analytics problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy warning:** do not attach MAC addresses, device IDs, serial
        numbers, account IDs, session/auth keys, raw health data, or unredacted
        packet captures. Use synthetic addresses and aggregate values.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD` or the release version.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Acquisition / BLE connection
        - Dashboard / API
        - Analytics / statistics
        - Installation / systemd
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, BlueZ, adapter model, band model/firmware. Redact unique identifiers.
      placeholder: Fedora 41, Python 3.11, BlueZ 5.88, generic USB BLE adapter, Band 9 firmware ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
      description: Remove MACs, device names/suffixes, keys, tokens, and health data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed MAC addresses, device IDs, serial numbers, account IDs, keys, tokens, and raw health data.
          required: true
        - label: This is not a security vulnerability (those go through private reporting).
          required: true
