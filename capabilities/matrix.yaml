schema_version: 1
updated: "2026-11-25"
device:
  model: "Kimi-B19FB"
  firmware: "4.2.0.230(C00M07)"
  platform: "OpenHarmony wearable firmware (Ambiq Apollo3)"

# Enum values
#   realtime / historical: yes | no | partial | unknown
#   verification: confirmed | partial | hypothesis | unknown
#
# Do not promote a row from hypothesis to partial/confirmed without a device
# observation or a decoded capture. In particular, BPM availability does not
# imply IBI/HRV or raw PPG availability.

entries:
  - id: hr_hqs
    measurement: heart_rate
    realtime: "yes"
    historical: "no"
    sampling_hz: 1.0
    resolution_bits: 8
    timestamp_precision: "~1 s (host receive time)"
    access: "BLE GATT 0x180D / 0x2A37 notify"
    dependencies: []
    verification: "confirmed"
    evidence:
      - docs/02_ble_recon.md
      - docs/13_capture_results.md
      - captures/raw/hr_persistence_test.jsonl
    notes: >-
      Continuous while HR Data Broadcast is active. Survives screen-off and
      host disconnect; does not auto-resume across a normal restart because
      reaching Settings requires exiting the broadcast.

  - id: hr_proprietary_live
    measurement: heart_rate
    realtime: "partial"
    historical: "no"
    sampling_hz: null
    resolution_bits: null
    timestamp_precision: null
    access: "FE86 0x19/0x03 (data path reported for Band 10, not verified here)"
    dependencies: [hichain3]
    verification: "hypothesis"
    evidence:
      - docs/04_protocol_spec.md
      - docs/13_capture_results.md
    notes: >-
      The 0x19/0x03 live-HR path and a 0x7F status/data TLV are reported for
      Band 10. No Band 9 packet has been decoded yet; do not treat as working.

  - id: hr_auto_setting
    measurement: heart_rate
    realtime: "no"
    historical: "no"
    sampling_hz: null
    resolution_bits: null
    timestamp_precision: null
    access: "FE86 0x07/0x17 on/off"
    dependencies: [hichain3]
    verification: "confirmed"
    evidence:
      - docs/04_protocol_spec.md
      - docs/13_capture_results.md
    notes: >-
      Pure on/off command (TLV 0x01 = 01/00). No interval parameter exists in
      the app command surface; sampling is firmware-controlled.

  - id: hr_history
    measurement: heart_rate
    realtime: "no"
    historical: "partial"
    sampling_hz: null
    resolution_bits: null
    timestamp_precision: unknown
    access: "FE86 0x07/0x0A count, 0x07/0x0B minute records"
    dependencies: [hichain3]
    verification: "partial"
    evidence:
      - docs/04_protocol_spec.md
      - docs/13_capture_results.md
      - docs/16_hichain3_streams.md
    notes: >-
      Request/response commands and the 0x81/0x84 envelope are confirmed.
      Inner 0x06/0x07/0x08 fields are preserved raw and only partially decoded;
      expect HR plus other per-minute metrics. Times are Unix seconds.

  - id: spo2_auto_setting
    measurement: spo2
    realtime: "no"
    historical: "no"
    sampling_hz: null
    resolution_bits: null
    timestamp_precision: null
    access: "FE86 0x07/0x24 on/off"
    dependencies: [hichain3]
    verification: "confirmed"
    evidence:
      - docs/04_protocol_spec.md
      - docs/13_capture_results.md
    notes: >-
      Pure on/off command. No interval parameter is exposed by Huawei Health.

  - id: spo2_on_demand
    measurement: spo2
    realtime: "unknown"
    historical: "unknown"
    sampling_hz: null
    resolution_bits: null
    timestamp_precision: null
    access: "unknown; band-side measurement confirmed, no live phone packet"
    dependencies: [hichain3]
    verification: "partial"
    evidence:
      - docs/16_hichain3_streams.md
    notes: >-
      Two band-side spot measurements displayed 98-99% and 97%, but the phone
      saw no SpO2 value (only a periodic 0x25/0x01 poll). The result is stored
      on the band; 0x25/0x03=100 is not SpO2.

  - id: spo2_history
    measurement: spo2
    realtime: "no"
    historical: "partial"
    sampling_hz: null
    resolution_bits: null
    timestamp_precision: unknown
    access: "0x2C file read spo2.bin (8,694 bytes); 0x07 window queries empty"
    dependencies: [hichain3]
    verification: "partial"
    evidence:
      - docs/16_hichain3_streams.md
      - docs/15_firmware_static_analysis.md
    notes: >-
      spo2.bin was retrieved in 960-byte chunks. Its records are dated 17-18
      Nov 2026 and look like PPG/OSA features, not the 25 Nov spot readings.
      The 0x07 windows returned no records after either measurement.

  - id: ibi_hrv
    measurement: ibi_hrv
    realtime: "unknown"
    historical: "unknown"
    sampling_hz: null
    resolution_bits: null
    timestamp_precision: null
    access: "0x2C/0x01 rrisqi_data.bin (114 bytes retrieved); HRV tab in app"
    dependencies: [hichain3]
    verification: "partial"
    evidence:
      - docs/16_hichain3_streams.md
      - docs/15_firmware_static_analysis.md
    notes: >-
      A 114-byte rrisqi_data.bin was retrieved through 0x2C; its float fields
      are not yet mapped to SDNN/RMSSD. The HRV tab exists in the app. Ordinary
      BPM must not be used to infer IBI/HRV availability.

  - id: raw_ppg
    measurement: raw_ppg
    realtime: "unknown"
    historical: "unknown"
    sampling_hz: null
    resolution_bits: null
    timestamp_precision: null
    access: "unverified; no protocol path decoded"
    dependencies: [hichain3]
    verification: "unknown"
    evidence:
      - docs/15_firmware_static_analysis.md
    notes: >-
      Firmware references arrhythmia_ppg_localdata_new.bin and OSA SpO2 feature
      files, so raw/feature PPG can be stored internally. This is not evidence
      of an external raw-PPG stream. Do not infer raw PPG from BPM or SpO2.
