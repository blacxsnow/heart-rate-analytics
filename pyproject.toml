[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-band-rev"
version = "0.1.0"
description = "Independent BLE acquisition for the Huawei Band 9"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Independent research" }]
keywords = ["huawei", "band", "ble", "heart-rate", "acquisition", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "bleak>=0.22",
    "rich>=13",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "httpx>=0.27", "pandas>=2.2"]
analysis = ["pandas>=2.2", "numpy>=1.26", "matplotlib>=3.8"]
mqtt = ["paho-mqtt>=2.1"]
proprietary = ["cryptography>=42"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "cryptography>=42",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.scripts]
band9 = "fitness_band.main:main"
band9-acquire = "fitness_band.acquisition.service:main"
band9-analyze = "fitness_band.analysis.report:main"

[project.urls]
Homepage = "https://github.com/blacxsnow/heart-rate-analytics"
Repository = "https://github.com/blacxsnow/heart-rate-analytics"
Issues = "https://github.com/blacxsnow/heart-rate-analytics/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
